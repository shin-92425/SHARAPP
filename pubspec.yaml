name: shape_buddy
description: A child-friendly app that recognises and outlines shapes using OpenCV and a TensorFlow Lite CNN.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  opencv_dart: ^2.2.2
  tflite_flutter: ^0.12.1
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/shape_model.tflite
    - assets/models/labels.txt
